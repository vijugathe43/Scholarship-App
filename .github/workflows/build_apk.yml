name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create full Flutter project scaffold
        run: |
          flutter create scaffold_tmp \
            --platforms=android \
            --org=com.scholarship.class4 \
            --project-name=scholarship_app_4th
          # Copy android folder to workspace
          cp -r scaffold_tmp/android ./android
          rm -rf scaffold_tmp
          echo "Android folder ready:"
          ls android/

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Flutter setup
        run: |
          flutter doctor -v
          echo "--- Dart files ---"
          find lib -name "*.dart" | head -20

      - name: Build Debug APK
        run: flutter build apk --debug --no-shrink

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ScholarshipApp-Class4-APK
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
