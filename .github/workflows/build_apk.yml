name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Detect and Fix Directory Structure
        run: |
          echo "Current directory contents:"
          ls -la
          if [ -d "Scolarship Project" ]; then
            echo "Moving files from 'Scolarship Project' to root"
            cp -r "Scolarship Project"/* .
          elif [ -d "Scholarship Project" ]; then
            echo "Moving files from 'Scholarship Project' to root"
            cp -r "Scholarship Project"/* .
          fi
          mkdir -p assets
          ls -la

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Clean Android Files
        run: |
          flutter create temp_scaffold --platforms=android --org=com.scholarship.class4 --project-name=scholarship_app_4th
          cp -r temp_scaffold/android .
          rm -rf temp_scaffold

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ScholarshipApp-Class4-APK
          path: build/app/outputs/flutter-apk/*.apk
